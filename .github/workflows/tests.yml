# What has to be true before anything here is believed.
#
# This is the skeleton `composer create-project streetmesh/server` produces: a
# Laravel application, its configuration, its assets, and a dependency on
# `streetmesh/laravel`, which carries the behaviour. So there is one job.
#
# The packages this used to test live in StreetMesh/Laravel now and are tested
# there. The matrix went on naming directories that had left, so every run since
# has failed at Install — five red marks reporting nothing about this
# repository, next to the one job that has something to say about it.

name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: host
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # composer install, an .env, a key, a migrated database, and a built
      # front end. The build matters: a view rendering @vite needs a manifest,
      # and without one the failure is a missing file rather than a test.
      - name: Setup application
        run: composer setup

      - name: Check
        run: composer ci:check
